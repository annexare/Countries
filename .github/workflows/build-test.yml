name: Countries JS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/build-test.yml'
      - 'packages/countries/**'
      - 'packages/scripts/**'
      - 'packages/test-js/**'
      - 'packages/test-node/**'
      - 'packages/tsconfig/**'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'biome.json'
      - 'tsconfig.json'
      - '!**/.editorconfig'
      - '!**/LICENSE*'
      - '!**/README*'

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build & Test
        run: bun run ci
        env:
          CI: true

  test-node:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build dist
        run: bun run build

      # Run directly with `node` (not `bun run`, which `bunfig [run] bun=true`
      # would re-route to Bun) to validate the published bundles under Node.js.
      - name: Test dist under Node.js
        run: node --test packages/test-node/*.test.ts
        env:
          CI: true
